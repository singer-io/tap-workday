version: 2.1
jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout
      - run:
          name: "Setup virtual env"
          command: |
            uv venv --python 3.12 /usr/local/share/virtualenvs/tap-workday
            source /usr/local/share/virtualenvs/tap-workday/bin/activate
            uv pip install -U setuptools
            uv pip install .[dev]
      - run:
          name: "JSON Validator"
          command: |
            source /usr/local/share/virtualenvs/tap-tester/bin/activate
            stitch-validate-json tap_workday/schemas/*.json
      - run:
          name: "pylint"
          command: |
            source /usr/local/share/virtualenvs/tap-workday/bin/activate
            uv pip install pylint
            pylint tap_workday -d C,R,W
      - add_ssh_keys
      - run:
          name: "Unit Tests"
          command: |
            source /usr/local/share/virtualenvs/tap-workday/bin/activate
            uv pip install pytest pytest-cov
            pytest tests/unittests --cov=tap_workday --cov-report=html:htmlcov
      - store_test_results:
          path: test_output/report.xml
      - store_artifacts:
          path: htmlcov
      - run:
          name: "Integration Tests - All Streams"
          command: |
            source /usr/local/share/virtualenvs/tap-tester/bin/activate
            uv pip install --upgrade awscli
            aws s3 cp s3://com-stitchdata-dev-deployment-assets/environments/tap-tester/tap_tester_sandbox dev_env.sh
            source dev_env.sh
            unset USE_STITCH_BACKEND
            run-test --tap=tap-workday tests/test_all_fields.py
            run-test --tap=tap-workday tests/test_automatic_fields.py
            run-test --tap=tap-workday tests/test_bookmark.py
            run-test --tap=tap-workday tests/test_discovery.py
            run-test --tap=tap-workday tests/test_interrupted_sync.py
            run-test --tap=tap-workday tests/test_pagination.py
            run-test --tap=tap-workday tests/test_start_date.py


workflows:
  version: 2
  commit:
    jobs:
      - build:
          context: circleci-user
  build_daily:
    triggers:
      - schedule:
          cron: "0 19 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - build:
          context: circleci-user
